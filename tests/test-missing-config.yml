name: Test nonexistent config file causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pull alpine image
        run: docker pull alpine:3.17
      - id: action
        uses: .
        continue-on-error: true
        with:
          image: alpine:3.17
          config: tests/fixtures/does-not-exist.yaml
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing config"
            exit 1
          fi
          echo "PASS"
